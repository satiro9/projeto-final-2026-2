<!DOCTYPE html>
<!-- Feira Verde - Hortifrúti Online — Catálogo com carrinho (JavaScript) -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feira Verde - Hortifrúti Online</title>
  <meta name="description" content="Lista de produtos frescos com carrinho." />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .produtos { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; }
    .produto {
      background:#fff; padding:20px; border-radius:var(--radius);
      box-shadow:var(--shadow); text-align:center;
    }
    .produto .img { font-size:3.5rem; margin-bottom:10px; }
    .produto .preco { font-weight:800; color:var(--primary); font-size:1.2rem; margin:8px 0; }
    .produto button {
      background:var(--primary); color:#fff; border:0; padding:10px 16px;
      border-radius:8px; cursor:pointer; font-weight:600;
    }
    .produto button:hover { opacity:.9; }

    /* Carrinho lateral (drawer) */
    .carrinho-icone {
      position:fixed; bottom:20px; right:20px;
      background:var(--primary); color:#fff; padding:14px 18px;
      border-radius:999px; cursor:pointer; font-weight:700;
      box-shadow:var(--shadow); z-index:60; border:0;
    }
    .drawer {
      position:fixed; top:0; right:-380px; width:360px; max-width:90vw; height:100vh;
      background:#fff; box-shadow:-4px 0 20px rgba(0,0,0,.15);
      transition: right .3s ease; z-index:70; display:flex; flex-direction:column;
    }
    .drawer.aberto { right:0; }
    .drawer header { background:var(--primary); color:#fff; padding:18px; display:flex; justify-content:space-between; align-items:center; }
    .drawer .itens { flex:1; overflow-y:auto; padding:16px; }
    .drawer .item-c { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee; }
    .drawer footer { padding:18px; border-top:1px solid #eee; background:#fff; color:#111; }
    .remover { background:transparent; border:0; color:#dc2626; cursor:pointer; font-size:1.1rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav">
      <div class="logo">🥦 Feira Verde - Hortifrúti Online</div>
      <button class="menu-toggle" aria-label="Menu">☰</button>
      <ul id="menu">
        <li><a href="#inicio">Início</a></li>
        <li><a href="#produtos">Produtos</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </div>
  </header>

  <section class="hero" id="inicio">
    <h1>Feira Verde - Hortifrúti Online</h1>
    <p>Lista de produtos frescos com carrinho.</p>
    <a href="#produtos" class="btn">Ver produtos</a>
  </section>

  <section id="produtos">
    <div class="container">
      <h2>Produtos</h2>
      <p class="subtitle">Adicione ao carrinho e finalize o pedido</p>
      <div class="produtos" id="produtos-lista"></div>
    </div>
  </section>

  <section id="contato" style="background:#fff;">
    <div class="container">
      <h2>Contato</h2>
      <form class="contact" id="formContato" novalidate>
        <div><label for="nome">Nome</label><input id="nome" required /></div>
        <div><label for="email">E-mail</label><input id="email" type="email" required /></div>
        <div><label for="mensagem">Mensagem</label><textarea id="mensagem" rows="3"></textarea></div>
        <button type="submit" class="btn primary">Enviar</button>
        <div class="mensagem-feedback" id="feedback"></div>
      </form>
    </div>
  </section>

  <!-- Botão flutuante do carrinho -->
  <button class="carrinho-icone" id="abrirCarrinho">🛒 <span id="qtd-carrinho">0</span></button>

  <!-- Drawer do carrinho -->
  <aside class="drawer" id="drawer">
    <header>
      <strong>Seu carrinho</strong>
      <button onclick="fecharCarrinho()" style="background:transparent;border:0;color:#fff;font-size:1.4rem;cursor:pointer;">×</button>
    </header>
    <div class="itens" id="carrinho-itens"></div>
    <footer>
      <p style="display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;">
        Total: <span id="total">R$ 0,00</span>
      </p>
      <button class="btn primary" style="width:100%;margin-top:10px;" onclick="finalizarPedido()">Finalizar pedido</button>
    </footer>
  </aside>

  <footer><p>© <span id="ano"></span> Feira Verde - Hortifrúti Online</p></footer>

  <script>
    window.PRODUTOS = [{"id": 1, "nome": "Maçã (kg)", "desc": "Fuji, frescas", "preco": 8.9, "emoji": "🍎"}, {"id": 2, "nome": "Banana (kg)", "desc": "Nanica madura", "preco": 5.5, "emoji": "🍌"}, {"id": 3, "nome": "Brócolis", "desc": "Unidade", "preco": 6.0, "emoji": "🥦"}, {"id": 4, "nome": "Tomate (kg)", "desc": "Italiano", "preco": 7.2, "emoji": "🍅"}, {"id": 5, "nome": "Alface", "desc": "Crespa, unidade", "preco": 3.5, "emoji": "🥬"}, {"id": 6, "nome": "Cenoura (kg)", "desc": "Selecionada", "preco": 4.9, "emoji": "🥕"}, {"id": 7, "nome": "Morango", "desc": "Bandeja 300g", "preco": 12.0, "emoji": "🍓"}, {"id": 8, "nome": "Abacate", "desc": "Unidade", "preco": 6.5, "emoji": "🥑"},{"id": 1, "nome": "Melancia (kg)", "desc": "Fuji, frescas", "preco": 9.9, "emoji": "🍉"},];
    window.MOEDA = "R$";
    window.CTA = "Adicionar";
  </script>
  <script src="script.js"></script>
</body>
</html>
